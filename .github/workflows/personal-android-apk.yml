name: Personal Android APK

on:
  push:
    branches:
      - android-personal
    paths:
      - apps/mobile/app.config.ts
      - apps/mobile/package.json
      - apps/mobile/modules/**
      - apps/mobile/plugins/**
      - apps/mobile/android/**
      - apps/mobile/assets/**
  workflow_dispatch:
    inputs:
      abi:
        description: Android ABI list
        required: false
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a,arm64-v8a

permissions:
  contents: read

concurrency:
  group: personal-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Signed Android APK (${{ inputs.abi || 'arm64-v8a' }})
    if: github.repository == 'hustneverland/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VARIANT: production
      T3CODE_ANDROID_PACKAGE: io.github.hustneverland.t3code
      T3CODE_MOBILE_APP_NAME: 星野
      T3CODE_MOBILE_ICON_PRESET: xingye
      MOBILE_VERSION_POLICY: appVersion
      T3CODE_MOBILE_UPDATES_ENABLED: "1"
      T3CODE_MOBILE_UPDATES_URL: https://t3-remote.shiyanjia.com:18443/ota/manifest.json
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      ABI: ${{ inputs.abi || 'arm64-v8a' }}
      CCACHE_DIR: /home/runner/.cache/ccache
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle & ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/ccache
          key: personal-android-gradle-ccache-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json', 'apps/mobile/app.config.ts', 'pnpm-lock.yaml') }}
          restore-keys: |
            personal-android-gradle-ccache-${{ runner.os }}-

      - name: Configure Gradle caching & ccache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          mkdir -p ~/.gradle "${CCACHE_DIR}"
          printf 'org.gradle.caching=true\norg.gradle.daemon=false\n' > ~/.gradle/gradle.properties
          ccache --max-size=2G
          ccache --zero-stats

      - name: Enable T3 Connect public config
        run: cp .env.example .env

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: ./node_modules/.bin/expo prebuild --clean --platform android

      - name: Strip default debug signing from release buildType
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "apps/mobile/android/app/build.gradle";
            const src = fs.readFileSync(path, "utf8");
            const updated = src.replace(
              /(release\s*\{[\s\S]*?)\n\s*signingConfig\s+signingConfigs\.debug\b/,
              "$1",
            );
            if (updated !== src) {
              fs.writeFileSync(path, updated, "utf8");
              console.log("Removed default debug signingConfig from release buildType.");
            } else {
              console.log("No default debug signingConfig found in release buildType.");
            }
          '

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew --no-daemon --console=plain :app:assembleRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            "-PreactNativeArchitectures=${ABI}"

      - name: Align, sign, and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "::error::Missing Android signing secrets."
            exit 1
          fi

          KEYSTORE="${RUNNER_TEMP}/t3-code-personal.p12"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"

          keytool -list -keystore "${KEYSTORE}" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD

          APK_DIR="apps/mobile/android/app/build/outputs/apk/release"
          if [ -f "${APK_DIR}/app-release-unsigned.apk" ]; then
            INPUT_APK="${APK_DIR}/app-release-unsigned.apk"
          elif [ -f "${APK_DIR}/app-release.apk" ]; then
            INPUT_APK="${APK_DIR}/app-release.apk"
          else
            echo "::error::No release APK found in ${APK_DIR}"
            ls -la "${APK_DIR}" || true
            exit 1
          fi

          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: ${BUILD_TOOLS}"

          mkdir -p "${RUNNER_TEMP}/out"
          ALIGNED_APK="${RUNNER_TEMP}/aligned.apk"
          SHORT_SHA="${GITHUB_SHA::7}"
          OUT_APK="${RUNNER_TEMP}/out/T3-Code-Personal-${SHORT_SHA}-${ABI//,/-}.apk"

          "${BUILD_TOOLS}/zipalign" -f -P 16 4 "${INPUT_APK}" "${ALIGNED_APK}"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-type PKCS12 \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "${OUT_APK}" \
            "${ALIGNED_APK}"

          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "${OUT_APK}"
          "${BUILD_TOOLS}/zipalign" -c -P 16 4 "${OUT_APK}"

          BADGING="$("${BUILD_TOOLS}/aapt2" dump badging "${OUT_APK}")"
          echo "${BADGING}" | grep -E '^package:|^application-label:|^sdkVersion:|^native-code:'
          echo "${BADGING}" | grep -q "package: name='io.github.hustneverland.t3code'"
          unzip -l "${OUT_APK}" | grep -q "assets/index.android.bundle"

          SHA256="$(sha256sum "${OUT_APK}" | awk '{print $1}')"
          SIZE_MB="$(du -m "${OUT_APK}" | awk '{print $1}')"
          {
            echo "### T3 Code Personal Android APK"
            echo "- File: \`$(basename "${OUT_APK}")\` (${SIZE_MB} MB)"
            echo "- Package: \`io.github.hustneverland.t3code\`"
            echo "- ABI: \`${ABI}\`"
            echo "- SHA-256: \`${SHA256}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Clean up keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/t3-code-personal.p12" "${RUNNER_TEMP}/aligned.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: T3-Code-Personal-apk-${{ inputs.abi || 'arm64-v8a' }}
          path: ${{ runner.temp }}/out/*.apk
          retention-days: 30
